services:
  - type: web
    name: InsuranceNews-cocreo
    env: static
    staticPublishPath: insurance-news
    routes:
      - type: rewrite
        source: /
        destination: /support.html

  - type: web
    name: EikenSupport
    env: static
    staticPublishPath: eiken-support
    routes:
      - type: rewrite
        source: /
        destination: /support.html

  - type: web
    name: webapl
    runtime: node
    buildCommand: npm install && cd client && npm install && npx vite build && cd ../server && npm install
    startCommand: cd server && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
